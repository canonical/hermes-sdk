summary: setup-project preserves user-edited AGENTS.md and is idempotent

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # The `agents-md` task covers the fresh-write branch of setup-project.
  # Here we cover the other two branches against a real workshop:
  #   (2) AGENTS.md exists without the workshop-prompt fingerprint
  #       → setup-project must append, not overwrite.
  #   (3) AGENTS.md exists with the fingerprint
  #       → setup-project must be a no-op.
  #
  # `workshop restore` is the lifecycle command that re-runs setup hooks.
  F=/home/workshop/.pi/agent/AGENTS.md

  # Branch (2): pre-seed unrelated user content, then re-run hooks.
  workshop exec -- bash -c "echo 'MY USER NOTES' > $F"
  workshop restore
  workshop exec -- head -1 "$F" | MATCH "MY USER NOTES"
  workshop exec -- cat "$F" | MATCH "Workshop Container Environment Instructions"

  # Branch (3): re-run hooks again, AGENTS.md must be byte-identical.
  BEFORE=$(workshop exec -- sha256sum "$F" | awk '{print $1}')
  workshop restore
  AFTER=$(workshop exec -- sha256sum "$F" | awk '{print $1}')
  test "$BEFORE" = "$AFTER"

debug: |
  workshop exec -- ls -la /home/workshop/.pi/agent/ || true
  workshop exec -- cat /home/workshop/.pi/agent/AGENTS.md || true
