name: hermes-sdk
title: Hermes SDK
adopt-info: hermes
summary: Hermes Agent - The self-improving AI agent built by Nous Research.
description: |
  This SDK provides the Hermes Agent. 
  The self-improving AI agent built by Nous Research. It's the only agent with a built-in learning loop — it creates skills from experience, improves them during use, nudges itself to persist knowledge, searches its own past conversations, and builds a deepening model of who you are across sessions. 
license: MIT
website: https://github.com/NousResearch/hermes-agent
build-base: ubuntu@24.04
platforms:
  # Build each arch natively: npm-include-node downloads node for the build
  # host, so cross-building would bundle the wrong-arch node. riscv64 is omitted
  # (pi needs node >=22.19.0 and Node.js publishes no linux-riscv64 binary).
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

plugs:
  hermes-config:
    interface: mount
    workshop-target: /home/workshop/.hermes

parts:
  hermes:
    plugin: nil
    source: .
    build-packages:
      - git
      - python3
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"
    override-build: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      export HERMES_HOME="$CRAFT_PART_INSTALL/hermes-home"
      export HERMES_RUNTIME_DIR="$HERMES_HOME/tools"
      curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --hermes-home "$HERMES_HOME" --dir "$HERMES_HOME/hermes-agent" --commit "v$VERSION" --skip-computer-use
      python3 "$CRAFT_PROJECT_DIR/scripts/check-hermes-compatibility.py" || exit 1
      python3 "$CRAFT_PROJECT_DIR/scripts/seal-hermes.py"
      chmod -R a+rX "$HERMES_HOME"

  workshop-prompt:
    plugin: dump
    source: workshop-prompt.md
    source-type: file
